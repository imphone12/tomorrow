<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Vice City Open World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing">
  <div class="landing-panel">
    <div class="title-badge">OPEN WORLD</div>
    <h1>Vice City Inspired</h1>
    <p class="subtitle">crime, cars, police, chaos, neon streets</p>

    <div class="button-stack">
      <a class="btn primary" href="game.html">Start Game</a>
      <a class="btn" href="settings.html">Settings</a>
    </div>

    <div class="landing-info">
      <p>WASD / Arrows = Move</p>
      <p>E = Enter/Exit Car</p>
      <p>F = Interact</p>
      <p>Space = Shoot</p>
      <p>Shift = Sprint</p>
      <p>Enter = Cheat Console</p>
    </div>
  </div>
</body>
</html>
