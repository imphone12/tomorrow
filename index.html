<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomorrow - Vice City 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing">
  <div class="landing-panel">
    <div class="title-badge">OPEN WORLD / 3D</div>
    <h1>Tomorrow</h1>
    <p class="subtitle">Vice City inspired crime sandbox</p>

    <div class="button-stack">
      <a class="btn primary" href="game.html">Start Game</a>
      <a class="btn" href="settings.html">Settings</a>
    </div>

    <div class="landing-info">
      <p>WASD / Arrows = Move</p>
      <p>E = Enter / Exit car</p>
      <p>F = Interact</p>
      <p>Space = Shoot</p>
      <p>Shift = Sprint</p>
      <p>Enter = Cheat Console</p>
    </div>
  </div>
</body>
